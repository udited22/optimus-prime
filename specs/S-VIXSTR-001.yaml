# S-VIXSTR-001 (docs/research/strategy-hypotheses.md strategy library). RESEARCH: no evidence, no confidence. Param values are pre-registered
# priors, not fitted numbers. Every number here is ASSUMED until validated on real data.
id: S-VIXSTR-001
version: 0.1.0
status: RESEARCH
owner_agent: research.library
created: '2026-10-02'
hypothesis: When India VIX jumps >= 8% within 30 minutes while NIFTY has moved >= 0.4% in 15 minutes, a long ATM straddle
  bought then earns more from the realised move than it loses to theta and the IV change within 45 minutes.
economic_rationale: 'Volatility shocks cluster: a sudden VIX jump with a large index move is often followed by further large
  moves before implied volatility fully reprices.'
required_data:
- dataset: nifty_index_1m
  granularity: 1m
  fields:
  - open
  - high
  - low
  - close
  availability: UNVERIFIED
- dataset: nifty_opt_1m
  granularity: 1m
  fields:
  - open
  - high
  - low
  - close
  - volume
  availability: UNVERIFIED
- dataset: india_vix_1m
  granularity: 1m
  availability: UNVERIFIED
signal:
  formula: VIX / VIX(vix_minutes ago) - 1 >= vix_jump_pct and |15-min index return| >= move_pct -> BUY ATM CE + BUY ATM
    PE
  params:
    vix_jump_pct:
      value: 8
      min: 5
      max: 15
      step: 1
    vix_minutes:
      value: 30
      min: 15
      max: 60
      step: 15
    move_pct:
      value: 0.4
      min: 0.25
      max: 0.8
      step: 0.05
legs:
- side: BUY
  right: CE
- side: BUY
  right: PE
eligible_regimes:
- VOLATILITY_EXPANSION
prohibited_regimes:
- EVENT_REGIME
- LOW_LIQUIDITY
- ABNORMAL_MARKET
- NO_EDGE
invalidation_rules:
- kind: VOLATILITY
  description: India VIX falls back to its pre-spike level (the shock is over)
  action: EXIT_POSITION
- kind: REGIME_CHANGE
  description: the market turns abnormal (circuit-filter territory)
  action: EXIT_POSITION
  regimes:
  - ABNORMAL_MARKET
- kind: DATA
  description: 'the index or option bar of a minute is missing: no entry on that minute'
  action: CANCEL_ENTRY
selection:
  expiry: nearest weekly with DTE >= 1
  strike: ATM for both legs (the same strike)
entry:
  trigger: first VIX-spike bar
  window_start: 09:30:00
  window_end: '13:30:00'
  order:
    type: LIMIT
    price_rule: last option close + 1 tick (mid proxy), chase capped at first limit + max_chase_ticks
    ttl_seconds: 60
    max_chase_ticks: 2
  max_entries_per_day: 1  # OD-014 style default (docs/research/strategy-hypotheses.md entry caps): one straddle a day; a long straddle (CE+PE, same expiry and strike) counts as ONE entry
exit:
  stop:
    method: PREMIUM_PCT
    value: 35
    order: SL_LIMIT
    limit_offset_ticks: 4
  profit_taking: 1 R on the combined premium
  time_exit: '14:30:00'
  max_holding_minutes: 45
sizing:
  method: 1 lot per leg (2 lots concurrent) if the summed risk_at_stop <= the per-trade budget else NO TRADE; BLOCKED at
    canary by the 1-lot cap
  max_lots: 1
  risk_at_stop_formula: sum over both legs of (entry - stop_limit) * lot + round-trip charges + slippage
expected_frequency: 'rare: 0-2 per month (prior)'
expected_slippage:
  entry_ticks: 1
  exit_ticks: 1
  stop_ticks: 2
  source: assumed
cost_assumptions:
  cost_model_version: CM-2026-04-01
  brokerage_plan: upstox-options
capacity: high relative to one lot (NIFTY weekly ATM liquidity)
failure_modes:
- 'IV keeps rising for the seller but the realised move stops: the straddle bleeds theta'
- the IV spike reverses (vol crush) faster than the index moves
- two legs double the costs
falsification_criteria:
- OOS net expectancy per trade (R) 90% bootstrap CI upper bound < 0
- the straddle's 45-minute P&L after a spike is not above that of the same straddle bought at random times with matched
  VIX levels
cost_sensitivity: Two legs double the charges (about INR 100-140 a round trip at INR 20/order) and the slippage; the straddle
  needs a realised move larger than the combined premium's theta plus about 4-6% of its value in costs.
dependencies:
  weekly_expiry: true
retirement_criteria:
- OOS expectancy CI upper bound < 0
- live slippage > 2x assumed over 20 trades
# Event days (OD-014 default, 2-Oct-2026): NOT certified, so no entries on an EVENT_REGIME day. Setting true needs
# an event_certification record from validation/event_cert.py (VALIDATED on historical event-day trades, REAL data).
event_certified: false
