# H22 (docs/research/institutional-intelligence-layer.md §6). RESEARCH: no evidence, no confidence. Param
# values are pre-registered priors, not fitted numbers. Sources: Barbon & Buraschi, "Gamma Fragility" (SSRN 3725454);
# Dim, Eraker & Vilkov (SSRN 4692190); Baltussen et al. (JFE 2021). The gamma SIGN is the "India-short" reading
# pre-registered in H24 (F-GEX-001); if H24 finds the opposite sign, this hypothesis is falsified, not re-signed.
# Approximate minimum NAV: one ATM leg ~INR 70-130 x 65 x 30% stop + costs -> ~INR 70k-1.3 lakh.
# Promoted from specs/drafts/ on 3-Oct-2026 once its library plug-in (strategies/library/signals_intel.py) and its
# entry-cap row (docs/research/strategy-hypotheses.md) existed. Still RESEARCH: no evidence, no confidence.
id: S-GEXMO-001
version: 0.1.0
status: RESEARCH
owner_agent: research.intelligence
created: 2026-10-03
hypothesis: >
  On days when the partial-chain gamma concentration G at 10:15 (sum over the lake's strikes of Black-Scholes gamma
  from Dhan IV x OI x lot x spot^2 x 1%) is in the top tercile of its last 60 sessions, the first 15-minute NIFTY close
  beyond the 09:15-10:15 range is followed by a further move of at least 0.5 x range-width in the same direction within
  60 minutes more often than on days with G in the bottom two terciles, and an option bought on it has positive net
  expectancy.
economic_rationale: >
  Delta-hedgers who are short gamma trade with the move and amplify it (Barbon & Buraschi; Dim, Eraker & Vilkov find
  momentum under negative and reversal under positive market-maker gamma). SEBI's FY22-FY24 study shows individuals
  losing heavily in options while algorithmic prop traders and FPIs profit, consistent with (not proof of)
  non-individuals being net short options in NIFTY; large gamma near spot would then mean larger, trend-following
  hedge flows once a range breaks.
required_data:
  - {dataset: nifty_index_1m, granularity: 1m, fields: [open, high, low, close], availability: AVAILABLE}
  - {dataset: nifty_opt_1m_atm_band, granularity: 1m, fields: [close, oi, iv, strike, spot], availability: AVAILABLE}  # code 1 ATM-10..ATM+10
  - {dataset: nifty_opt_1m_next_expiry, granularity: 1m, fields: [close, oi, iv, strike, spot], availability: AVAILABLE}  # code 2 ATM-3..ATM+3
  - {dataset: nse_participant_oi_1d, granularity: 1d, fields: [client, pro, fii, dii, index_call_long, index_call_short, index_put_long, index_put_short], availability: UNCERTAIN, substitute: "the pre-registered India-short sign convention (all options counted as dealer-short); the participant file only confirms or rejects it"}
signal:
  formula: >
    G_10:15 = sum_K gamma_BS(K, iv_K, tau) * oi_K * lot * spot^2 * 0.01 over code-1 ATM+-10 and code-2 ATM+-3; g_rank =
    percentile of G_10:15 in the last g_lookback sessions; range = [min, max](index, 09:15-10:15); if g_rank >= g_pct_min:
    first close_15m > range_high -> BUY CE; first close_15m < range_low -> BUY PE
  params:
    g_pct_min: {value: 67, min: 50, max: 90, step: 1}
    g_lookback: {value: 60, min: 40, max: 120, step: 10}
    follow_fraction: {value: 0.5, min: 0.3, max: 0.8, step: 0.1}
legs:
  - {side: BUY, right: SIGNAL}
eligible_regimes: [TRENDING_UP, TRENDING_DOWN, VOLATILITY_NORMAL, VOLATILITY_EXPANSION, GAP_REGIME]
prohibited_regimes: [EVENT_REGIME, LOW_LIQUIDITY, ABNORMAL_MARKET, NO_EDGE]
invalidation_rules:
  - kind: PRICE_LEVEL
    description: "a 15-minute close back inside the 09:15-10:15 range"
    action: EXIT_POSITION
  - kind: TIME
    description: "no follow_fraction x range-width follow-through within 60 minutes of entry"
    action: EXIT_POSITION
  - kind: DATA
    description: "more than 3 of the lake's strikes lack OI or IV at 10:15: G is not computed, no entry today"
    action: STAND_DOWN_DAY
selection:
  expiry: "nearest weekly with DTE >= 1"
  strike: "delta 0.40-0.55 by own IV calc; spread <= 2 ticks"
entry:
  trigger: "first qualifying 15-minute close after 10:15"
  window_start: "10:15:00"
  window_end: "13:00:00"
  order: {type: LIMIT, price_rule: "mid + 1 tick, capped at max_price", ttl_seconds: 10, max_chase_ticks: 2}
  max_entries_per_day: 1  # one first-hour range a day
exit:
  stop: {method: PREMIUM_PCT, value: 30, order: SL_LIMIT, limit_offset_ticks: 4}
  profit_taking: "1.5 R or trailing at the 15-min swing"
  time_exit: "14:30:00"
  max_holding_minutes: 120
sizing:
  method: "fixed 1 lot if risk_at_stop <= risk_budget else NO TRADE"
  max_lots: 1
  risk_at_stop_formula: "(entry - stop_fill_estimate) * lot + round_trip_costs + slippage_allowance"
expected_frequency: "about 1 signal/week (prior: a third of days qualify on G, and of those perhaps half break)"
expected_slippage: {entry_ticks: 1, exit_ticks: 1, stop_ticks: 2, source: assumed}
cost_assumptions: {cost_model_version: CM-2026-04-01, brokerage_plan: upstox-options}
capacity: "high relative to one lot (NIFTY ATM liquidity)"
failure_modes:
  - "the sign is wrong: NIFTY's hedgers are net long gamma and high G means pinning and reversal"
  - "the partial chain (about +-500 points) misses the gamma that matters"
  - "OI is only updated with a lag intraday, so G at 10:15 reflects yesterday's book"
falsification_criteria:
  - "OOS net expectancy per trade (R) 90% bootstrap CI upper bound < 0"
  - "the follow-through rate on top-tercile-G days is not above that on other days (p >= 0.10)"
  - "H24 finds that high G predicts LOWER 10:15-14:45 realised volatility (the India-short sign is rejected)"
cost_sensitivity: >
  As H01: an ATM premium of INR 70-130 with a 30% stop risks about INR 1,400-2,500 a lot; a round trip of about INR
  50-70 is 3-5% of the risk. G is a filter, so it lowers frequency and total cost; the edge must survive 2x slippage
  (docs/research/validation.md V10).
dependencies: {weekly_expiry: true}
retirement_criteria:
  - "OOS expectancy CI upper bound < 0"
  - "live slippage > 2x assumed over 20 trades"
event_certified: false
