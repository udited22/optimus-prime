# S-VOLX-001 (docs/research/strategy-hypotheses.md strategy library). RESEARCH: no evidence, no confidence. Param values are pre-registered
# priors, not fitted numbers. Every number here is ASSUMED until validated on real data.
id: S-VOLX-001
version: 0.1.0
status: RESEARCH
owner_agent: research.library
created: '2026-10-02'
hypothesis: After 45 minutes in which NIFTY's high-low box is within 0.25% of price, a close beyond the box on an expanding
  bar is followed by a 30-minute move larger than ATM premium implies.
economic_rationale: Volatility clusters; intraday option premiums price average volatility and may underprice the expansion
  that follows compression.
required_data:
- dataset: nifty_index_1m
  granularity: 1m
  fields:
  - open
  - high
  - low
  - close
  availability: UNVERIFIED
- dataset: nifty_opt_1m
  granularity: 1m
  fields:
  - open
  - high
  - low
  - close
  - volume
  availability: UNVERIFIED
- dataset: india_vix_1m
  granularity: 1m
  availability: UNVERIFIED
- dataset: nifty_fut_1m
  granularity: 1m
  fields:
  - close
  - volume
  availability: UNCERTAIN
  substitute: bar-range expansion alone confirms the break (the 'with volume' filter is dropped)
signal:
  formula: box = previous comp_minutes; (hi-lo)/px <= comp_max_pct and bar range >= expansion_mult x mean box bar range
    (and futures volume >= volume_mult x box mean when present); close > box high -> BUY CE, < box low -> BUY PE
  params:
    comp_minutes:
      value: 45
      min: 30
      max: 90
      step: 15
    comp_max_pct:
      value: 0.25
      min: 0.15
      max: 0.4
      step: 0.05
    expansion_mult:
      value: 2.0
      min: 1.5
      max: 3.0
      step: 0.25
    volume_mult:
      value: 1.5
      min: 1.2
      max: 2.5
      step: 0.1
    lunch_filter:
      value: 1
      min: 0
      max: 1
      step: 1
legs:
- side: BUY
  right: SIGNAL
eligible_regimes:
- VOLATILITY_COMPRESSION
- VOLATILITY_NORMAL
prohibited_regimes:
- EVENT_REGIME
- LOW_LIQUIDITY
- ABNORMAL_MARKET
- NO_EDGE
invalidation_rules:
- kind: PRICE_LEVEL
  description: a close back inside the box by half of it
  action: EXIT_POSITION
- kind: REGIME_CHANGE
  description: the market turns abnormal
  action: EXIT_POSITION
  regimes:
  - ABNORMAL_MARKET
- kind: TIME
  description: no expansion within the 45-minute maximum hold
  action: EXIT_POSITION
- kind: DATA
  description: 'the index or option bar of a minute is missing: no entry on that minute'
  action: CANCEL_ENTRY
selection:
  expiry: nearest weekly with DTE >= 1
  strike: ATM (nearest the index); delta band not implemented
entry:
  trigger: first compression break outside 12:00-13:30
  window_start: '10:00:00'
  window_end: '14:00:00'
  order:
    type: LIMIT
    price_rule: last option close + 1 tick (mid proxy), chase capped at first limit + max_chase_ticks
    ttl_seconds: 60
    max_chase_ticks: 2
  max_entries_per_day: 2  # OD-014 style default (docs/research/strategy-hypotheses.md entry caps): compression can build and break twice (morning and afternoon)
exit:
  stop:
    method: PREMIUM_PCT
    value: 30
    order: SL_LIMIT
    limit_offset_ticks: 4
  profit_taking: 2 R
  time_exit: '14:40:00'
  max_holding_minutes: 45
sizing:
  method: 1 lot per leg if the summed risk_at_stop <= the per-trade budget (2% NAV) else NO TRADE
  max_lots: 1
  risk_at_stop_formula: sum over legs of (entry - stop_limit) * lot + round-trip charges + (entry+stop slippage ticks) *
    tick * lot
expected_frequency: 1-3 signals/week (prior)
expected_slippage:
  entry_ticks: 1
  exit_ticks: 1
  stop_ticks: 2
  source: assumed
cost_assumptions:
  cost_model_version: CM-2026-04-01
  brokerage_plan: upstox-options
capacity: high relative to one lot (NIFTY weekly ATM liquidity)
failure_modes:
- lunchtime drift produces false breaks (hence the 12:00-13:30 filter)
- breaks that immediately retrace into the box
falsification_criteria:
- OOS net expectancy per trade (R) 90% bootstrap CI upper bound < 0
- post-compression 30-minute absolute moves are not larger than the ATM straddle-implied move
cost_sensitivity: A 2 R target on a 30% stop is a 60% premium move; it needs an expansion of 40-80 index points. Costs are
  5-8% of the target, so the edge is mostly about the hit rate, not costs.
dependencies:
  weekly_expiry: true
retirement_criteria:
- OOS expectancy CI upper bound < 0
- live slippage > 2x assumed over 20 trades
# Event days (OD-014 default, 2-Oct-2026): NOT certified, so no entries on an EVENT_REGIME day. Setting true needs
# an event_certification record from validation/event_cert.py (VALIDATED on historical event-day trades, REAL data).
event_certified: false
