# H32. RESEARCH: no evidence, no confidence. Param values are
# pre-registered priors, not fitted numbers, written before the spec ran on any data (3-Oct-2026). Two-leg long ATM
# straddle under OD-013 (same strike and expiry, combined risk at both stops <= 2% of NAV).
id: S-VOLCHEAP-001
version: 0.1.0
status: RESEARCH
owner_agent: research.volatility
created: 2026-10-03
hypothesis: >
  On a high-forecast-volatility day (high forecast volatility = ANY of: K-11 v0 VOLATILITY_EXPANSION at the decision bar, H25 F-TERM-001 TERM_LOW (known from 09:30), H26 F-HMMREG-001 HMM_TURBULENT (known pre-open; only from its first out-of-sample fit, Mar-2024)), a long ATM straddle of the nearest weekly (DTE >= 1) bought 09:45-11:00
  when the HAR forecast of today's open-to-close variance is at least theta_ratio x the one-session variance implied by
  the ATM IV, with the widest stop that fits the 2% budget, has positive net expectancy per trade, and out-earns
  S-VOLHOLD-001 (the same label condition without the price-of-volatility condition) on the same days.
economic_rationale: >
  The labels forecast realised volatility (3-Oct-2026 research: H26 TURBULENT vs CALM forward RV 10.9% vs 7.8%, CI
  excludes 0; H25 TERM_LOW 9.9% vs 8.3%; K-11 EXPANSION is followed by top-tercile RV). Options already price much of
  that, so the long-only use is to buy only when the price of volatility is below the forecast (Goyal & Saretto RV > IV;
  Muravyev & Ni intraday vs overnight). Selling is prohibited (OD-006), so a positive variance premium cannot be harvested.
required_data:
  - {dataset: nifty_index_1m, granularity: 1m, fields: [open, high, low, close], availability: AVAILABLE}
  - {dataset: nifty_opt_1m_atm_band, granularity: 1m, fields: [open, high, low, close, volume], availability: AVAILABLE}
  - {dataset: india_vix_1m, granularity: 1m, availability: AVAILABLE}
  - {dataset: regime_alt_labels_daily, granularity: 1d, fields: [h25_term_tercile, h26_hmm_state], availability: AVAILABLE}  # scripts/vol_features.py from the H25/H26 label files (point in time)
signal:
  formula: >
    09:45-11:00, once a day, not on expiry days: if high forecast volatility and HAR_forecast(RV_oc) / (IV_atm^2 / 252)
    >= theta_ratio -> BUY ATM CE + BUY ATM PE (same strike, same expiry); per-leg stop = the widest % from the spec
    stop down to budget_stop_min_pct (0.5% steps) at which the summed risk_at_stop <= 2% of NAV, else NO TRADE
  params:
    theta_ratio: {value: 1.0, min: 0.8, max: 1.5, step: 0.05}
    har_lookback_days: {value: 22, min: 15, max: 30, step: 1}
    budget_stop_min_pct: {value: 15, min: 10, max: 25, step: 5}
legs:
  - {side: BUY, right: CE}
  - {side: BUY, right: PE}
eligible_regimes: [VOLATILITY_COMPRESSION, VOLATILITY_NORMAL, VOLATILITY_EXPANSION]
prohibited_regimes: [EVENT_REGIME, EXPIRY_REGIME, LOW_LIQUIDITY, ABNORMAL_MARKET, NO_EDGE]
invalidation_rules:
  - kind: VOLATILITY
    description: "the realised variance from entry to 12:30 is below half the forecast pro rata: the thesis has failed"
    action: EXIT_POSITION
  - kind: REGIME_CHANGE
    description: "the market turns abnormal"
    action: EXIT_POSITION
    regimes: [ABNORMAL_MARKET]
  - kind: DATA
    description: "the index or option bar of a minute is missing: no entry on that minute"
    action: CANCEL_ENTRY
selection:
  expiry: "nearest weekly with DTE >= 1"
  strike: "ATM for both legs (the same strike)"
entry:
  trigger: "first minute from 09:45 on which a high-volatility label holds and ratio >= theta_ratio"
  window_start: "09:45:00"
  window_end: "11:00:00"
  order: {type: LIMIT, price_rule: "last option close + 1 tick (mid proxy) per leg, chase capped at max_chase_ticks", ttl_seconds: 60, max_chase_ticks: 2}
  max_entries_per_day: 1  # one straddle a day (ONE entry)
exit:
  stop: {method: PREMIUM_PCT, value: 40, order: SL_LIMIT, limit_offset_ticks: 4}  # the widest premium-aware stop
  profit_taking: "none: held to the 12:30 thesis check or the 14:40 time exit"
  time_exit: "14:40:00"
  max_holding_minutes: 295
sizing:
  method: "1 lot per leg (2 lots concurrent, OD-013 long straddle) with the premium-aware stop; NO TRADE if even budget_stop_min_pct does not fit 2% of NAV"
  max_lots: 1
  risk_at_stop_formula: "sum over both legs of (entry - stop_limit) * lot + round-trip charges + slippage"
expected_frequency: "a few days a month at INR 1 lakh; about none at INR 10k (the budget cannot hold a straddle)"
capacity: "high relative to one lot per leg"
failure_modes:
  - "options already price the forecast volatility (no cheapness left once the label is known)"
  - "the premium-aware stop is too tight for a straddle held to the afternoon (noise stops)"
  - "two legs double the costs and the spread"
falsification_criteria:
  - "OOS net expectancy per trade (R) 90% day-block bootstrap CI upper bound < 0"
  - "it does not out-earn S-VOLHOLD-001 on the walk-forward period (difference of mean R, 90% CI lower bound <= 0)"
  - "fewer than 30 walk-forward trades at INR 1 lakh: untestable, reported as such"
cost_sensitivity: >
  Two legs pay about INR 80 of brokerage plus statutory charges and two spreads a round trip; the realised move must
  cover theta from entry to exit plus 1-2% of premium in costs, and the edge must survive 2x slippage (V10).
expected_slippage: {entry_ticks: 1, exit_ticks: 1, stop_ticks: 2, source: assumed}
cost_assumptions: {cost_model_version: CM-2026-04-01, brokerage_plan: upstox-options}
dependencies: {weekly_expiry: true}
retirement_criteria:
  - "OOS expectancy CI upper bound < 0"
  - "live slippage > 2x assumed over 20 trades"
event_certified: false
