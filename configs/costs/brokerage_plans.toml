# Brokerage plans for NSE index options. Versioned; verified = false plans are refused unless explicitly allowed.
# kind: "flat_per_order" (amount per executed order), "zero", "pct_with_cap" (min(rate * turnover, cap) per order).
# exercise_brokerage: per-exercise charge; omitted = unknown -> pricing an exercise raises CostModelError.

config_version = "2026-10-01.1"
# Owner decision OD-004 (30-Sep-2026): Upstox is the live execution broker.
default_live_plan = "upstox-options"

