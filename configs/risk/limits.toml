# own entry.max_entries_per_day (StrategySpec); the Governor and the allocator enforce both. Entries are ENTRY orders
# submitted; a two-leg straddle is ONE entry (its completing leg is journalled counts_as_entry = false).
max_trades_per_day = 10
cooldown_after_stop_min = 15
martingale_lookback_trades = 3
min_slippage_ticks_per_side = 2
buying_power_buffer = "500"

# --- liquidity / price sanity ---
spread_max_ticks = 2
spread_max_frac_of_mid = "0.03"
min_top_of_book_lots = 2
min_oi = 0
limit_below_bid_ticks = 5
limit_above_ask_ticks = 2
