# Strangles (different strikes) are NOT covered by OD-013 and stay blocked.
strategy_max_lots = { "S-VIXSTR-001" = 2, "S-IVRV-001" = 2, "S-DAYVOL-001" = 2, "S-VOLCHEAP-001" = 2, "S-VOLHOLD-001" = 2, "S-EXPVOL-001" = 2 }
# OD-014: the system-wide cap on new entries per day is 10 (was 3). Each spec also has its
# own entry.max_entries_per_day (StrategySpec); the Governor and the allocator enforce both. Entries are ENTRY orders
# submitted; a two-leg straddle is ONE entry (its completing leg is journalled counts_as_entry = false).
max_trades_per_day = 10
cooldown_after_stop_min = 15
martingale_lookback_trades = 3
min_slippage_ticks_per_side = 2
buying_power_buffer = "500"

# --- liquidity / price sanity ---
spread_max_ticks = 2
spread_max_frac_of_mid = "0.03"
min_top_of_book_lots = 2
min_oi = 0
limit_below_bid_ticks = 5
limit_above_ask_ticks = 2
quote_max_age_s = "3"

# --- protective exit / tickets ---
protective_stop_confirm_s = "3"
ticket_ttl_s = "2"

# --- kill thresholds (docs/risk/risk-engine.md §9.4; initial, tuned in Phase 1/3) ---
strategy_consecutive_stops = 3
strategy_slippage_multiple = "2"     # OD-017: sum(realised) > 2x sum(modelled) over the last 5 fills -> STRATEGY kill
strategy_slippage_breach_trades = 3  # legacy SLIPPAGE_BREACH events (none are emitted by the runtime any more)
strategy_invalid_intents = 3
portfolio_unexplained_pnl_frac = "0.01"
dq_stale_s = "3"
dq_healthy_reset_s = "60"
broker_ws_down_s = "10"
broker_unknown_order_s = "10"
broker_error_threshold = 5          # OD-017: 5 order/API errors or timeouts within broker_error_window_s ...
broker_error_window_s = "900"       # ... = 15 minutes
abnormal_index_move_frac = "0.01"   # OD-017: a 1% NIFTY move inside 5 minutes (the fast-move rule) ...
abnormal_index_move_window_min = 5
abnormal_vix_jump_frac = "0.20"     # OD-017: India VIX up more than 20% since the session open
abnormal_cooloff_min = 30           # OD-017: owner reset or 30-minute cool-off; re-latches while the condition holds
clock_drift_ms = 250
disk_free_min_frac = "0.10"
# --- OD-017 additions ---
abnormal_index_from_open_frac = "0.02"   # NIFTY more than 2% from the session open (either way) -> ABNORMAL_MARKET
broker_consecutive_error_threshold = 3   # 3 order/API errors in a row -> BROKER_CONNECTIVITY
slippage_window_fills = 5                # the window for strategy_slippage_multiple
slippage_single_fill_multiple = "3"      # any single fill above 3x its modelled slippage -> STRATEGY kill
