# Risk Governor limits (K-02). Versioned; any change = git commit + owner approval; load only outside market hours.
# Sources: the constitution owner decisions, docs/risk/risk-engine.md §9.2 (limits) and §9.4 (kill thresholds).
# Items listed in `pending_signoff` are DESIGN DEFAULTS awaiting owner sign-off; they are deliberately on the safe side.
# Old versions are kept unchanged; the loader picks the latest adopted_on unless a version is requested.

[[limits]]
version = "RL-2026-09-30.1"             # SUPERSEDED by RL-2026-10-01.1 (OD-010)
adopted_on = 2026-09-30
owner_decisions = ["OD-002", "OD-005", "OD-006", "OD-007", "OD-008"]
pending_signoff = [
  "dd_suspend_frac",            # 12.5% suspension (directive only says 'suspend if approaching 15%')
  "abnormal_index_move_frac",   # X in docs/risk/risk-engine.md §9.4 not yet chosen
  "abnormal_index_move_window_min",
  "abnormal_vix_jump_frac",
  "abnormal_cooloff_min",
  "broker_error_threshold",
  "strategy_slippage_multiple",
]

