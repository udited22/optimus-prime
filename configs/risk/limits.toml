strategy_slippage_breach_trades = 3  # legacy SLIPPAGE_BREACH events (none are emitted by the runtime any more)
strategy_invalid_intents = 3
portfolio_unexplained_pnl_frac = "0.01"
dq_stale_s = "3"
dq_healthy_reset_s = "60"
broker_ws_down_s = "10"
broker_unknown_order_s = "10"
broker_error_threshold = 5          # OD-017: 5 order/API errors or timeouts within broker_error_window_s ...
broker_error_window_s = "900"       # ... = 15 minutes
abnormal_index_move_frac = "0.01"   # OD-017: a 1% NIFTY move inside 5 minutes (the fast-move rule) ...
abnormal_index_move_window_min = 5
abnormal_vix_jump_frac = "0.20"     # OD-017: India VIX up more than 20% since the session open
abnormal_cooloff_min = 30           # OD-017: owner reset or 30-minute cool-off; re-latches while the condition holds
clock_drift_ms = 250
disk_free_min_frac = "0.10"
# --- OD-017 additions ---
abnormal_index_from_open_frac = "0.02"   # NIFTY more than 2% from the session open (either way) -> ABNORMAL_MARKET
broker_consecutive_error_threshold = 3   # 3 order/API errors in a row -> BROKER_CONNECTIVITY
slippage_window_fills = 5                # the window for strategy_slippage_multiple
slippage_single_fill_multiple = "3"      # any single fill above 3x its modelled slippage -> STRATEGY kill

