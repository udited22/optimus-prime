# Public host composition example. The public build supports replay/paper operation only.
# Secrets are never stored here; external credentials belong in ignored/local runtime configuration.
config_version = "2026-10-08.public"

[host]
mode = "replay"              # replay | paper | live; live remains locked in this public build
feed = "replay"              # public-safe default
state_dir = "/tmp/optimus-prime" # journal/reports for local replay; production paths are private configuration
nav = "100000"               # SIMULATED paper-book capital used only to exercise sizing/risk code
interval_s = 1.0
status_port = 8780
webhook_port = 8781
backup_keep = 30
max_consecutive_failures = 5

[schedule]
token_request = "08:45:00"   # illustrative paper-session schedule
gate_deadline = "09:05:00"
end_of_day = "15:35:00"

[feed_keys]
index = ""
vix = ""
fut = ""

[upstox]
# Adapter configuration is retained for interface compatibility; account/runtime settings are private.
base_url = "https://api.upstox.com"
feed_mode = "full"

[replay]
seed = 7
start = "2026-10-05"
days = 1
step_s = 15
pace_s = 0.0
rehearse_orders = true
rehearsal_nav = "100000"
hold_after = false

[live_lock]
unlocked = false
owner_signoff = ""
checklist_sha256 = ""
