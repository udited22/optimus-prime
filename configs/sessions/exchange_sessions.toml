# NSE exchange session times (IST). Versioned by effective date. THIS IS THE EXCHANGE, NOT OUR TRADING WINDOW.
# Our own (narrower) trading window lives in trading_window.toml and must always sit inside the F&O normal market.
# Holidays / special sessions are NOT modelled here (backlog D-03).

config_version = "2026-10-01.1"

[[fo]]   # NSE equity derivatives (F&O) segment
version = "NSE-FO-2021-01-01"
effective_from = 2021-01-01          # backtest coverage start (not the historical start of these hours)
effective_to = 2024-09-30
normal_open = "09:15:00"
normal_close = "15:30:00"
verified = true
sources = ["S45", "S46"]
notes = "Normal market 09:15-15:30 unchanged until 2-Aug-2026 (NSE/FAOP/74467: 'previously 15:30'). Trade-modification end and closing-price VWAP window are deliberately NOT set for 2021-2024-09 (not sourced). Known disruption: 24-Feb-2021 NSE halted trading ~11:40 and re-opened with an extended session to 17:00 (news reports; UNVERIFIED detail) - bars that day are expected to be abnormal."

