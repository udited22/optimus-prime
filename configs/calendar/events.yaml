# Scheduled market-moving events (docs/risk/risk-engine.md §9.2 "Event days"; K-11 EVENT_REGIME). Schema: schemas/events.schema.json,
# loader: project100c.calendar.events.load_event_book. Versioned: any change = git commit.
#
# Rules:
# - Every entry carries the URL of the official public source it was checked against.
# - verified: true only when that official page itself states the date. Anything else is verified: false, and the
#   strategies and the classifier ignore it (EventBook.to_calendar keeps verified entries only).
# - No invented dates. An RBI MPC entry is the final day of the meeting, the day the resolution is announced; past
#   meetings link the resolution itself, future ones the RBI's published schedule (status SCHEDULED).
# - NSE holiday circulars were not reachable from this host (HTTP 403 on 2-Oct-2026); trading holidays live in
#   configs/calendar/nse_fo_holidays.toml and are not repeated here.
# - impact (default same_session): the Indian session the event moves.
#   - US FOMC statements (2:00 pm ET = 23:30 IST in EDT, 00:30 IST in EST) and US CPI releases (8:30 am ET =
#     18:00 / 19:00 IST) land after the NSE close (15:30 IST), so they are impact: next_session.
#   - EVENT_REGIME then applies to the first NSE trading day strictly after the US date (EventBook.to_calendar
#     with the trading calendar).
#   - Days beyond the holiday book (2027) are provisional: fixed-date holidays only. Re-check them when the
#     2027 book lands.
# - FOMC dates are from the Fed's calendar, which marks each meeting tentative until confirmed at the preceding
#   meeting; the entry date is the statement day (the meeting's last day).
# - US CPI dates are from the BLS release schedule. It lists releases to Dec-2026 only; 2027 is not yet
#   published, so there are no 2027 CPI entries. The page was read with the web fetch tool, because curl from
#   the box gets HTTP 403.
