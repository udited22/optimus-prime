last_old_weekly = 2024-12-19
first_new_weekly = 2025-01-02
last_old_monthly = 2025-01-30
first_new_monthly = 2025-02-27
carryover_cycles = ["MONTHLY"]
carryover_min_expiry = 2025-03-01   # existing quarterly / half-yearly contracts (Mar-2025 onward)
carryover_until_eod = 2024-12-26
verified = true
sources = ["NSE/FAOP/64625 (18-Oct-2024) + corrigendum NSE/FAOP/64672 + update NSE/FAOP/64990 (08-Nov-2024)", "Zerodha Z-Connect 'SEBI's new rules for index derivatives'; Kotak Neo bulletin; Moneycontrol 21-Oct-2024"]
notes = "The 26-Dec-2024 monthly and the 30-Jan-2025 monthly keep lot 25; weeklies from 2-Jan-2025 are 75."

