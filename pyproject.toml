[project]
name = "project100c"
version = "0.0.0"
description = "Optimus Prime: research-first quantitative trading and capital-allocation system (deterministic risk kernel, backtester, validation)"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.8,<3", "pyyaml>=6", "pyarrow>=17"]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "mypy>=1.11", "ruff>=0.6", "types-PyYAML", "cryptography>=42"]
# the trading host: the encrypted credential store (ops/credstore.py)
host = ["cryptography>=42"]
research = ["numpy>=2", "matplotlib>=3.8"]  # research scripts

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/project100c"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tools/feasibility_calc.py" = ["E501"]  # prints wide markdown tables
